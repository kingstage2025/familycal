<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamani Family - Visioconférence</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <style>
        :root {
            --bg-body: #090a0f; 
            --surface-color: #161821; 
            --surface-hover: #222532;
            --surface-glass: rgba(22, 24, 33, 0.7);
            --text-primary: #ffffff; 
            --text-secondary: #94a3b8; 
            --border-color: rgba(255, 255, 255, 0.1);
            --primary-color: #4f46e5; 
            --primary-hover: #6366f1; 
            --danger-color: #ef4444; 
            --danger-hover: #f87171;
            --success-color: #10b981; 
            --radius-lg: 24px; 
            --radius-md: 16px; 
            --radius-sm: 8px;
            --font-main: 'Poppins', system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: var(--font-main); 
            background-color: var(--bg-body); 
            color: var(--text-primary); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        .material-symbols-outlined { font-size: 22px; display: inline-block; vertical-align: middle; }

        /* --- EN-TETE --- */
        .header { 
            padding: 16px 24px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: transparent; 
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 20;
            pointer-events: none;
        }
        .header-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.5); pointer-events: auto;}
        .header-info { display: flex; gap: 12px; pointer-events: auto;}
        .info-badge { 
            display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; 
            background: var(--surface-glass); backdrop-filter: blur(10px);
            padding: 8px 16px; border-radius: 30px; border: 1px solid var(--border-color); 
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .main { flex: 1; display: flex; position: relative; overflow: hidden; }

        /* --- GRILLE VIDEO --- */
        .video-section { flex: 1; position: relative; background: var(--bg-body); display: flex; align-items: center; justify-content: center; padding: 80px 20px 100px 20px; transition: all 0.3s ease; }
        .videos-grid { 
            display: grid; width: 100%; height: 100%; max-width: 1400px; gap: 16px; 
            transition: all 0.3s ease; 
        }

        /* Layout 1: Plein écran */
        .videos-grid[data-count="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        
        /* Layout 2: WhatsApp Style */
        .videos-grid[data-count="2"] { display: flex; position: relative; justify-content: center; align-items: center; }
        .videos-grid[data-count="2"] .video-card:not(#card-local) { width: 100%; height: 100%; border-radius: var(--radius-lg); }
        .videos-grid[data-count="2"] #card-local { 
            position: absolute; bottom: 20px; right: 20px; 
            width: clamp(100px, 25vw, 180px); aspect-ratio: 3/4; 
            border-radius: var(--radius-md); border: 2px solid var(--border-color); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10; 
        }

        /* Layout 3+: Google Meet Style */
        .videos-grid[data-count="3+"] { 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            align-content: center; justify-items: center; 
        }

        .video-card { 
            background: var(--surface-color); border-radius: var(--radius-lg); 
            overflow: hidden; position: relative; width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { transform: scaleX(-1); }
        .remote-video video { transform: scaleX(1); }

        .video-avatar { 
            position: absolute; width: 100px; height: 100px; 
            background: linear-gradient(135deg, var(--primary-color), #818cf8); 
            color: white; border-radius: 50%; display: none; justify-content: center; align-items: center; 
            font-size: 40px; font-weight: 600; text-transform: uppercase; 
        }
        .video-card.cam-off video { display: none; }
        .video-card.cam-off .video-avatar { display: flex; }

        .video-label { 
            position: absolute; bottom: 16px; left: 16px; 
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); 
            color: white; padding: 6px 12px; border-radius: 8px; 
            font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; 
        }

        /* --- BARRE DE CONTROLES FLOTTANTE --- */
        .controls-wrapper {
            position: absolute; bottom: 24px; left: 0; right: 0;
            display: flex; justify-content: center; pointer-events: none; z-index: 30;
        }
        .controls { 
            display: flex; align-items: center; gap: 12px; 
            background: var(--surface-glass); backdrop-filter: blur(16px); 
            padding: 12px 24px; border-radius: 100px; border: 1px solid var(--border-color); 
            pointer-events: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        
        .btn { 
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
            padding: 12px 20px; font-family: inherit; font-size: 14px; font-weight: 500; 
            border-radius: 100px; border: none; cursor: pointer; transition: all 0.2s; color: white; 
        }
        .btn-icon-only { padding: 14px; min-width: 50px; height: 50px; border-radius: 50%; }
        .btn-primary { background: var(--primary-color); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: rgba(255,255,255,0.1); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .btn-danger { background: var(--danger-color); }
        .btn-danger:hover { background: var(--danger-hover); }
        
        .btn-toggle { background: rgba(255,255,255,0.1); }
        .btn-toggle.disabled { background: var(--danger-color); }

        /* --- PANNEAU LATERAL --- */
        .sidebar { 
            width: 380px; background: var(--surface-color); border-left: 1px solid var(--border-color); 
            display: flex; flex-direction: column; 
            transform: translateX(100%); position: absolute; right: 0; top: 0; bottom: 0; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 40;
            box-shadow: -10px 0 40px rgba(0,0,0,0.3);
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar-header { 
            padding: 24px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border-color); 
        }
        .tab-content { flex: 1; overflow-y: auto; padding: 20px; display: none; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        /* Chat Design */
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-right: 8px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .msg-author { font-size: 11px; margin-bottom: 6px; color: var(--text-secondary); font-weight: 500; }
        .msg-bubble { padding: 12px 16px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        
        .msg-self { align-self: flex-end; }
        .msg-self .msg-bubble { background: var(--primary-color); border-radius: 16px 16px 4px 16px; }
        .msg-self .msg-author { text-align: right; display: none; }
        
        .msg-other { align-self: flex-start; }
        .msg-other .msg-bubble { background: var(--surface-hover); border-radius: 16px 16px 16px 4px; }

        .chat-input-area { display: flex; gap: 12px; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-color); }
        .input-text { 
            width: 100%; padding: 14px 20px; background: var(--bg-body); 
            border: 1px solid var(--border-color); border-radius: 100px; 
            color: white; font-family: inherit; font-size: 14px; outline: none; transition: border 0.3s; 
        }
        .input-text:focus { border-color: var(--primary-color); }

        /* --- MODALS --- */
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); 
            display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; 
        }
        .modal-content { 
            background: var(--surface-color); padding: 40px; border-radius: var(--radius-lg); 
            width: 100%; max-width: 420px; text-align: center; border: 1px solid var(--border-color); 
            box-shadow: 0 24px 48px rgba(0,0,0,0.5); 
        }
        .modal-content h2 { margin-bottom: 8px; font-size: 28px; font-weight: 600; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg-body); border-radius: var(--radius-md); margin-bottom: 8px; border: 1px solid var(--border-color); }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .header { padding: 16px; flex-direction: column; align-items: flex-start; gap: 10px; }
            .info-badge { padding: 6px 12px; font-size: 12px; }
            .video-section { padding: 90px 10px 90px 10px; }
            .videos-grid[data-count="3+"] { grid-template-columns: 1fr 1fr; }
            
            .controls { padding: 8px 16px; gap: 8px; width: 90%; justify-content: space-between; }
            .btn span:not(.material-symbols-outlined) { display: none; }
            .sidebar { width: 100%; border-radius: 0; border-left: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <span class="material-symbols-outlined" style="color: var(--primary-color);">family_home</span>
            Kamani Family
        </div>
        <div class="header-info">
            <div class="info-badge"><span class="material-symbols-outlined" style="color:var(--success-color); font-size:18px;">schedule</span><span id="timer">00:00</span></div>
            <div class="info-badge"><span class="material-symbols-outlined" style="color:var(--primary-color); font-size:18px;">vpn_key</span><span id="code-span">----</span></div>
        </div>
    </div>

    <div class="main">
        <div class="video-section" id="video-section">
            <div class="videos-grid" id="videos-grid" data-count="1">
                <div class="video-card" id="card-local">
                    <video id="local-video" autoplay muted playsinline></video>
                    <div class="video-avatar" id="avatar-local">?</div>
                    <div class="video-label"><span class="material-symbols-outlined" style="font-size: 16px;">person</span><span>Vous</span></div>
                </div>
            </div>
        </div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <strong style="font-size: 18px;" id="sidebar-title">Menu</strong>
                <button class="btn btn-secondary btn-icon-only" onclick="closeSidebar()" style="min-width:40px; height:40px; padding:0;"><span class="material-symbols-outlined">close</span></button>
            </div>
            
            <div id="participants" class="tab-content">
                <div id="participants-list"></div>
            </div>
            
            <div id="waiting" class="tab-content">
                <div id="waiting-list"></div>
            </div>
            
            <div id="chat" class="tab-content">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" class="input-text" placeholder="Écrire un message..." onkeypress="handleChatKey(event)" />
                    <button class="btn btn-primary btn-icon-only" onclick="sendMessage()" style="min-width:48px; height:48px; padding:0;"><span class="material-symbols-outlined" style="font-size: 20px;">send</span></button>
                </div>
            </div>
        </div>
    </div>

    <div class="controls-wrapper">
        <div class="controls">
            <button class="btn btn-toggle" id="btn-mic" onclick="toggleMic()"><span class="material-symbols-outlined" id="icon-mic">mic</span><span class="desktop-text">Micro</span></button>
            <button class="btn btn-toggle" id="btn-camera" onclick="toggleCamera()"><span class="material-symbols-outlined" id="icon-camera">videocam</span><span class="desktop-text">Caméra</span></button>
            <button class="btn btn-secondary btn-icon-only" onclick="openSidebar('chat')"><span class="material-symbols-outlined">chat</span></button>
            <button class="btn btn-secondary btn-icon-only" id="btn-menu-members" onclick="openSidebar('participants')"><span class="material-symbols-outlined">group</span></button>
            <button class="btn btn-secondary btn-icon-only" id="btn-admin" style="display:none; color:var(--danger-hover);" onclick="toggleAdminPanel(true)"><span class="material-symbols-outlined">admin_panel_settings</span></button>
            <button class="btn btn-danger btn-icon-only" onclick="leaveCall()"><span class="material-symbols-outlined">call_end</span></button>
        </div>
    </div>

    <!-- Modals de connexion identiques à ta logique, juste restylisées -->
    <div id="join-modal" class="modal">
        <div class="modal-content">
            <h2>Kamani Family</h2>
            <p style="color:var(--text-secondary); font-size:14px; margin-bottom:30px;">Espace de Visioconférence Privé</p>
            
            <div id="name-section">
                <input type="text" id="name-input" class="input-text" placeholder="Ton prénom (Ex: Papa, Ariel...)" style="margin-bottom: 24px; text-align: center; border-radius: 12px;"/>
                <div style="display:flex; gap:12px; flex-direction: column;">
                    <button class="btn btn-primary" onclick="handleAction('create')" style="width: 100%; border-radius: 12px;">Créer un salon</button>
                    <button class="btn btn-secondary" onclick="handleAction('join')" style="width: 100%; border-radius: 12px;">Rejoindre avec un code</button>
                </div>
            </div>
            
            <div id="join-section" style="display:none;">
                <input type="text" id="join-code-input" class="input-text" placeholder="CODE (4 LETTRES)" maxlength="4" style="text-transform:uppercase; letter-spacing:8px; text-align:center; font-size: 20px; margin-bottom: 24px; font-weight: bold; border-radius: 12px;" />
                <div style="display:flex; gap:12px;">
                    <button class="btn btn-secondary" style="flex:1; border-radius: 12px;" onclick="cancelJoin()">Retour</button>
                    <button class="btn btn-primary" style="flex:1; border-radius: 12px;" onclick="submitJoinRequest()">Rejoindre</button>
                </div>
            </div>
            
            <div id="waiting-host-section" style="display:none;">
                <div style="margin-bottom: 20px;">
                    <span class="material-symbols-outlined" style="font-size: 48px; color: var(--primary-color);">hourglass_empty</span>
                </div>
                <p style="color: white; font-weight:500; font-size: 18px;">En attente de l'organisateur...</p>
                <p style="color: var(--text-secondary); font-size: 14px; margin-top: 8px;">Il doit valider ton entrée.</p>
            </div>
        </div>
    </div>

    <!-- Modale Admin -->
    <div id="admin-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2 style="font-size: 24px; color: var(--danger-hover);">Gestion du Salon</h2>
            <div id="admin-actions-list" style="max-height:250px; overflow-y:auto; margin-bottom: 20px; display:flex; flex-direction:column; gap:8px; text-align: left;"></div>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn btn-primary" style="border-radius:12px;" onclick="admitAllWaitingUsers()">Accepter toutes les demandes</button>
                <button class="btn btn-secondary" style="border-radius:12px;" onclick="toggleAdminPanel(false)">Fermer le menu</button>
            </div>
        </div>
    </div>

    <script>
        // État global préservé
        const STATE = { peer: null, roomCode: '', isHost: false, localStream: null, myName: 'Anonyme', hostConn: null, connections: {}, calls: {}, participants: {}, waitingUsers: {}, isMicEnabled: true, isCamEnabled: true, timerInterval: null, seconds: 0 };
        const PREFIX = "KAMANIFAM-2026-";

        // --- GESTION UI ---
        function openSidebar(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            const titles = { 'participants': 'Membres', 'waiting': 'En Attente', 'chat': 'Discussion' };
            document.getElementById('sidebar-title').innerText = titles[tabId];
            document.getElementById('sidebar').classList.add('active');
            adjustVideoSection(true);
        }

        function closeSidebar() { 
            document.getElementById('sidebar').classList.remove('active'); 
            adjustVideoSection(false);
        }

        function adjustVideoSection(sidebarOpen) {
            if(window.innerWidth > 768) {
                document.getElementById('video-section').style.paddingRight = sidebarOpen ? '400px' : '20px';
            }
        }

        function updateGridCount() {
            const grid = document.getElementById('videos-grid');
            const count = grid.children.length;
            grid.setAttribute('data-count', count >= 3 ? '3+' : count);
        }

        function toggleAdminPanel(show) { 
            document.getElementById('admin-modal').style.display = show ? 'flex' : 'none'; 
            if(show) renderAdminParticipants();
        }

        // --- GESTION LOGIQUE (Complétée à partir de ton code coupé) ---
        function handleAction(action) {
            const name = document.getElementById('name-input').value.trim();
            if(!name) return alert("S'il te plaît, entre ton prénom pour la famille.");
            STATE.myName = name;
            document.getElementById('avatar-local').innerText = name.charAt(0);
            
            if(action === 'create') { createMeeting(); } 
            else { 
                document.getElementById('name-section').style.display = 'none'; 
                document.getElementById('join-section').style.display = 'block'; 
            }
        }

        function cancelJoin() { 
            document.getElementById('join-section').style.display = 'none'; 
            document.getElementById('name-section').style.display = 'block'; 
        }

        async function startLocalStream() {
            try {
                STATE.localStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, facingMode: "user" }, audio: true });
                document.getElementById('local-video').srcObject = STATE.localStream;
            } catch (err) {
                alert("Impossible d'accéder à la caméra ou au micro.");
            }
        }

        async function createMeeting() {
            await startLocalStream();
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
            let code = ''; for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            STATE.roomCode = code; STATE.isHost = true;
            initPeer(`${PREFIX}${code}-HOST`);
        }

        async function submitJoinRequest() {
            const code = document.getElementById('join-code-input').value.trim().toUpperCase();
            if(code.length !== 4) return alert("Le code doit faire 4 lettres.");
            await startLocalStream();
            STATE.roomCode = code; STATE.isHost = false;
            document.getElementById('join-section').style.display = 'none';
            document.getElementById('waiting-host-section').style.display = 'block';
            initPeer();
        }

        function initPeer(specificId = null) {
            STATE.peer = specificId ? new Peer(specificId) : new Peer();
            
            STATE.peer.on('open', (id) => {
                document.getElementById('code-span').innerText = STATE.roomCode;
                if(STATE.isHost) {
                    document.getElementById('join-modal').style.display = 'none';
                    document.getElementById('btn-admin').style.display = 'inline-flex';
                    startTimer();
                } else {
                    STATE.hostConn = STATE.peer.connect(`${PREFIX}${STATE.roomCode}-HOST`, { metadata: { name: STATE.myName } });
                    STATE.hostConn.on('open', () => STATE.hostConn.send({ type: 'REQUEST_ACCESS', name: STATE.myName }));
                    STATE.hostConn.on('data', (data) => {
                        if(data.type === 'ACCEPTED') {
                            document.getElementById('join-modal').style.display = 'none';
                            startTimer();
                        }
                    });
                }
            });

            STATE.peer.on('call', (call) => {
                call.answer(STATE.localStream);
                call.on('stream', (stream) => { addOrUpdateVideoCard(call.peer, stream); });
            });
        }

        function startTimer() {
            STATE.timerInterval = setInterval(() => {
                STATE.seconds++;
                const m = String(Math.floor(STATE.seconds / 60)).padStart(2, '0');
                const s = String(STATE.seconds % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        // Complétion de la fonction qui était coupée dans ta requête
        function addOrUpdateVideoCard(pId, stream) {
            let card = document.getElementById(`card-${pId}`);
            if(!card) {
                card = document.createElement('div');
                card.className = 'video-card remote-video';
                card.id = `card-${pId}`;
                card.innerHTML = `
                    <video autoplay playsinline></video>
                    <div class="video-avatar">?</div>
                    <div class="video-label"><span class="material-symbols-outlined" style="font-size: 16px;">person</span><span>Membre</span></div>
                `;
                document.getElementById('videos-grid').appendChild(card);
            }
            card.querySelector('video').srcObject = stream;
            updateGridCount();
        }

        function toggleMic() {
            STATE.isMicEnabled = !STATE.isMicEnabled;
            STATE.localStream.getAudioTracks()[0].enabled = STATE.isMicEnabled;
            const btn = document.getElementById('btn-mic');
            btn.classList.toggle('disabled', !STATE.isMicEnabled);
            document.getElementById('icon-mic').innerText = STATE.isMicEnabled ? 'mic' : 'mic_off';
        }

        function toggleCamera() {
            STATE.isCamEnabled = !STATE.isCamEnabled;
            STATE.localStream.getVideoTracks()[0].enabled = STATE.isCamEnabled;
            const btn = document.getElementById('btn-camera');
            btn.classList.toggle('disabled', !STATE.isCamEnabled);
            document.getElementById('icon-camera').innerText = STATE.isCamEnabled ? 'videocam' : 'videocam_off';
            document.getElementById('card-local').classList.toggle('cam-off', !STATE.isCamEnabled);
        }

        function leaveCall() {
            if(confirm("Voulez-vous vraiment quitter l'appel ?")) {
                location.reload();
            }
        }
    </script>
</body>
</html>
